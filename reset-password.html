
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AA Classes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f7f4ec;
      font-family: Arial, sans-serif;
      color: #0B2545;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(11, 37, 69, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d7dce3;
      border-radius: 9px;
      font: inherit;
    }

    .btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #d4a64a;
      color: #0B2545;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #0B2545;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Password</h1>
    <p id="description">
      Verify your reset link to create a new password for your AA Classes account.
    </p>

    <form id="resetForm" hidden>
      <label for="newPassword">New Password</label>
      <input
        id="newPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
        placeholder="Enter new password">

      <label for="confirmPassword">Confirm New Password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
        placeholder="Re-enter new password">

      <button class="btn" id="resetButton" type="submit">
        Update Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back-link" href="/index.html">
      Back to AA Classes
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://zgrctvejgmyubhnxrlqr.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_s6UQp7nI3LPyXDJ4u6mipg_62wsb-ZW';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('resetButton');
    const description = document.getElementById('description');

    let recoveryReady = false;
    let passwordUpdated = false;

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.style.color =
        type === 'success' ? '#16794a' : '#b42318';
    }

    function showResetForm() {
      if (passwordUpdated) return;

      recoveryReady = true;
      form.hidden = false;
      description.textContent =
        'Enter your new password below. Use at least 6 characters.';
      message.textContent = '';
    }

    const hasRecoveryCode =
      new URLSearchParams(window.location.search).has('code');

    const hasRecoveryHash =
      window.location.hash.includes('type=recovery');

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        showResetForm();
      }
    });

    async function checkRecoverySession() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        showMessage(
          'Could not verify the reset link. Please request a new one.'
        );
        return;
      }

      if (
        data.session &&
        (hasRecoveryCode || hasRecoveryHash)
      ) {
        showResetForm();
        return;
      }

      if (!data.session && !hasRecoveryCode && !hasRecoveryHash) {
        showMessage(
          'Please open the password reset link sent to your email.'
        );
      }
    }

    checkRecoverySession();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage(
          'Your reset link is not verified. Please request a new link.'
        );
        return;
      }

      const newPassword =
        document.getElementById('newPassword').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        showMessage(
          'Your password must contain at least 6 characters.'
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('The passwords do not match.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      try {
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          throw new Error(
            'Your reset link may have expired. Please request a new one.'
          );
        }

        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        passwordUpdated = true;
        recoveryReady = false;
        form.hidden = true;

        showMessage(
          'Password updated successfully! You can now log in using your new password.',
          'success'
        );

        await supabaseClient.auth.signOut();

      } catch (error) {
        showMessage(
          error.message || 'Could not update your password.'
        );
      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
